# KubeGuardian Configuration Example
# This file shows all available configuration options

controller:
  # Address to serve metrics
  metricsAddr: ":8080"
  # Address to serve health probes
  probeAddr: ":8081"
  # Enable leader election
  leaderElection: true
  # Sync period for controller
  syncPeriod: 30s
  # Maximum concurrent reconciles
  maxConcurrentReconciles: 1

detection:
  # Path to rules file (can be absolute or relative)
  rulesFile: "/etc/kubeguardian/rules/rules.yaml"
  # How often to evaluate detection rules
  evaluationInterval: 30s
  # Number of crash loop restarts before triggering remediation
  crashLoopThreshold: 3
  # Number of failed deployment attempts before triggering remediation
  failedDeploymentThreshold: 5
  # CPU usage percentage threshold for auto-scaling
  cpuThresholdPercent: 80.0
  # Memory usage percentage threshold for remediation
  memoryThresholdPercent: 85.0
  # OOM kill threshold (number of OOM kills before triggering remediation)
  oomKillThreshold: 2
  # Node health detection settings
  nodeDetection:
    # Enable node health detection
    enabled: true
    # How often to check node health
    checkInterval: 1m
    # Automatically cordon nodes with critical issues (NotReady)
    autoCordon: false
    # Automatically uncordon nodes when they become healthy
    autoUncord: false
    # How long to keep a node cordoned
    cordonDuration: 15m
  # Kubernetes events detection settings
  events:
    # Enable event monitoring
    enabled: true
    # Namespaces to monitor (empty = all)
    namespaces: []
    # How far back to look for events
    since: 1h
    # Deduplication window for repeated events
    dedupWindow: 5m
  # Security policy detection settings
  security:
    # Enable security scanning
    enabled: true
    # How often to scan for security violations
    scanInterval: 15m
  # Prometheus metrics provider settings
  prometheus:
    # Enable querying Prometheus for real metrics
    enabled: false
    # Prometheus server URL
    url: "http://prometheus:9090"
    # Request timeout
    timeout: 10s

remediation:
  # Enable remediation actions
  enabled: true
  # Maximum number of retry attempts for failed remediation
  maxRetries: 3
  # Interval between retry attempts
  retryInterval: 10s
  # Run in dry-run mode (don't actually make changes)
  dryRun: false
  # Enable automatic deployment rollback
  autoRollbackEnabled: true
  # Enable automatic replica scaling
  autoScaleEnabled: true
  # Cooldown period between remediation actions (seconds)
  cooldownSeconds: 300

notification:
  slack:
    # Enable Slack notifications
    enabled: false
    # Slack bot token (should be provided via secret in production)
    token: ""
    # Slack channel to send notifications to
    channel: "#kubeguardian"
    # Username for the bot
    username: "KubeGuardian"
    # Icon emoji for the bot
    iconEmoji: ":robot_face:"
  email:
    # Enable email notifications
    enabled: false
    # SMTP server host
    host: "smtp.example.com"
    # SMTP server port
    port: 587
    # SMTP username
    username: ""
    # SMTP password (should be provided via secret in production)
    password: ""
    # Sender email address
    from: "kubeguardian@example.com"
    # Recipient email address
    to: ""
    # Use TLS for SMTP connection
    useTLS: false
    # Skip TLS certificate verification (insecure)
    skipTLSVerify: false
  webhook:
    # Enable webhook notifications
    enabled: false
    # Webhook URL
    url: ""
    # HTTP method (POST, PUT, PATCH)
    method: "POST"
    # Custom HTTP headers
    headers: {}
    # Request timeout
    timeout: 10s
    # Secret token for webhook authentication (sent as X-KubeGuardian-Secret header)
    secret: ""
    # Payload type (json)
    payloadType: "json"
